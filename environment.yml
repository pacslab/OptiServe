# Conda environment for OptiServe.
# Dependencies are defined canonically in pyproject.toml; this file creates a
# Python 3.11 environment and installs the package (with experiment extras) via pip
# so the two never drift.
name: optiserve
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - -e ".[experiments]"

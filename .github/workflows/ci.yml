name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the previous run for that PR; pushes to main are
# never cancelled so every commit on the default branch keeps a green/red record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  # Guarantee no job can reach real AWS even if a test forgets to mock.
  AWS_ACCESS_KEY_ID: testing
  AWS_SECRET_ACCESS_KEY: testing
  AWS_SESSION_TOKEN: testing
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  # ------------------------------------------------------------------------ #
  # Fast feedback: style, imports, formatting.
  # ------------------------------------------------------------------------ #
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ruff
        run: pip install "ruff==0.8.4"
      - name: ruff check
        run: ruff check --output-format=github optiserve tests examples scripts
      - name: ruff format --check
        run: ruff format --check optiserve tests examples scripts

  # ------------------------------------------------------------------------ #
  # Static typing. Runs on the strict subset declared in pyproject.
  # ------------------------------------------------------------------------ #
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: mypy
        run: mypy --no-error-summary optiserve

  # ------------------------------------------------------------------------ #
  # The dependency lockfile must not drift from pyproject.toml.
  # ------------------------------------------------------------------------ #
  deps-in-sync:
    name: requirements.txt matches pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare dependency sets
        run: python scripts/check_requirements_sync.py

  # ------------------------------------------------------------------------ #
  # Offline suite (unit + golden) across the supported interpreter matrix.
  # ------------------------------------------------------------------------ #
  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # One macOS leg guards against platform-specific float/BLAS drift in
          # the analytical core; the golden baselines are the canary.
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Unit + golden suite
        run: |
          pytest -q -m "not integration" \
            --cov=optiserve \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=junit-${{ matrix.os }}-${{ matrix.python-version }}.xml

      - name: Enforce coverage floor
        run: coverage report --fail-under=75

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit-*.xml
          if-no-files-found: ignore

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # ------------------------------------------------------------------------ #
  # AWS adapter integration tests against a moto server — no real credentials.
  # ------------------------------------------------------------------------ #
  integration:
    name: Integration (mocked AWS)
    runs-on: ubuntu-latest
    services:
      mock-aws:
        image: motoserver/moto:5.0.28
        ports: ["5000:5000"]
    env:
      AWS_ENDPOINT_URL: http://localhost:5000
      OPTISERVE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Wait for the mock control plane
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5000/moto-api/ >/dev/null 2>&1; then
              echo "moto is up"; exit 0
            fi
            sleep 2
          done
          echo "moto did not become healthy in time" >&2
          exit 1

      - name: Integration suite (in-process mock)
        env:
          AWS_ENDPOINT_URL: ""
        run: pytest -q -m integration

      - name: Integration suite (moto server over HTTP)
        # The same tests against the real endpoint seam. Only this leg can catch
        # a client built with the wrong endpoint or a stale cached client, which
        # the in-process mock patches around from the inside.
        run: pytest -q -m integration

  # ------------------------------------------------------------------------ #
  # The shipped artifact: build both image targets and smoke-test them.
  # ------------------------------------------------------------------------ #
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: optiserve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the runtime image
        run: |
          docker run --rm optiserve:ci --help
          docker run --rm --entrypoint python optiserve:ci \
            -c "import optiserve; print(optiserve.__version__)"
          # The production image must not run as root.
          test "$(docker run --rm --entrypoint id optiserve:ci -u)" != "0"

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: optiserve:ci-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the offline suite inside the dev image
        run: docker run --rm optiserve:ci-dev pytest -q -m "not integration"

      - name: Full compose stack (dev image + moto)
        run: |
          docker compose build integration
          docker compose run --rm integration
          docker compose down -v

  # ------------------------------------------------------------------------ #
  # Distribution sanity: the wheel installs clean and imports on its own.
  # ------------------------------------------------------------------------ #
  package:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "import optiserve; print(optiserve.__version__)"
          /tmp/fresh/bin/optiserve --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ------------------------------------------------------------------------ #
  # Single required check so branch protection needs one entry, not nine.
  # ------------------------------------------------------------------------ #
  ci-ok:
    name: CI
    if: always()
    needs: [lint, typecheck, deps-in-sync, test, integration, docker, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job did not succeed
        run: |
          results='${{ join(needs.*.result, " ") }}'
          echo "upstream results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::a required job reported '${result}'"
              exit 1
            fi
          done

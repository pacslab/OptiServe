[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optiserve"
version = "0.1.0"
description = "A framework for modeling and optimizing serverless ML applications on AWS (cost, latency, accuracy)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Arian Boukani", email = "boukani.arian@gmail.com" }]
keywords = ["serverless", "aws-lambda", "optimization", "performance-modeling", "mlsys"]

# Core runtime dependencies (the library itself — no notebook/experiment deps).
dependencies = [
    "networkx==3.3",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "boto3==1.34.127",
    "joblib==1.4.2",
    "tqdm==4.66.4",
    "matplotlib==3.9.0",
]

[project.optional-dependencies]
# Everything the evaluation notebooks / benchmark deployment need but the library does not.
experiments = [
    "scikit-learn==1.5.0",
    "seaborn==0.13.2",
    "sagemaker==2.224.4",
    "jupyter",
    "ipykernel",
]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/pacslab/optiserve"
Repository = "https://github.com/pacslab/optiserve"

[tool.setuptools.packages.find]
include = ["optiserve*"]
exclude = ["tests*", "experiments*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
